  { "from": "/v1/api-gateway", "to": "/functions/v1/api-gateway", "match": "prefix", "requireToken": true },
  { "from": "/api/", "to": "/functions/v1/api-gateway/api/", "match": "prefix", "requireToken": true }
]"""
