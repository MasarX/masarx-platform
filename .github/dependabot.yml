version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    commit-message:
      prefix: Deps
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-major:
        patterns: ['*']
        update-types: [major]

  - package-ecosystem: npm
    directory: /tooling/apps/deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    commit-message:
      prefix: Deps
    groups:
      deploy-tooling:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    rebase-strategy: disabled
    commit-message:
      prefix: Deps
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
