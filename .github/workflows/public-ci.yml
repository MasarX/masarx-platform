name: ci

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      regenerate_visual_baselines:
        description: Regenerate restored visual specs using the audited local visual config
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  CI: 'true'
  ENV_FILE: /dev/null
  ENV_FILE_APPEND: '0'
  ENV_FILE_OVERRIDE: '0'
  NX_DAEMON: 'false'
  NX_SKIP_NX_CACHE: 'true'
  NX_NO_CLOUD: 'true'
  NEXT_TELEMETRY_DISABLED: '1'
  JEST_RETRY_TIMES: '0'
  GROUP_BASE: ${{ github.event.merge_group.base_sha }}
  CI_BASE_BRANCH: ${{ github.event.pull_request.base.ref || (github.event.merge_group.base_ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.default_branch) || (!startsWith(github.event.merge_group.base_ref, 'refs/heads/') && (github.event.merge_group.base_ref || github.ref_name)) || '' }}
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  LANDING_SITE_URL: http://127.0.0.1:3333
  LANDING_APP_URL: http://127.0.0.1:3001
  LANDING_CONTACT_ENDPOINT: /__landing-contact
  LANDING_TENANT_SIGNUP_ENDPOINT: /__tenant-signup
  LANDING_ENABLE_INTAKE_MOCKS: '1'

jobs:
  database-build:
    name: From-zero database build
    needs: append-only
    if: ${{ !cancelled() && (needs.append-only.result != 'success' || needs.append-only.outputs.database != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      present: ${{ steps.subject.outputs.present }}
    steps:
      - name: Record database job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - &timing_begin
        name: Mark prepare timing boundary
        id: timing_prepare
        uses: ./.github/actions/ci-timing
        with:
          phase: prepare
      - name: Detect subject
        id: subject
        run: node scripts/ci-hosted/tasks.cjs detect database
      - &timing_node
        name: Mark setup-node timing boundary
        if: always() && steps.timing_prepare.outcome == 'success'
        uses: ./.github/actions/ci-timing
        with:
          phase: setup-node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node24)
        if: steps.subject.outputs.present == 'true'
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Fail closed until image qualification is authorized
        if: steps.subject.outputs.present == 'true'
        run: node scripts/ci-hosted/backend.cjs preflight
      - &timing_work
        name: Mark workload timing boundary
        if: always() && steps.timing_prepare.outcome == 'success'
        uses: ./.github/actions/ci-timing
        with:
          phase: workload
      - name: Run subject
        id: qualification
        if: steps.subject.outputs.present == 'true'
        run: node scripts/ci-hosted/backend.cjs
      - &timing_report
        name: Mark reporting timing boundary
        if: always() && steps.timing_prepare.outcome == 'success'
        uses: ./.github/actions/ci-timing
        with:
          phase: reporting
      - name: Upload Postgres server log
        if: ${{ !cancelled() && steps.qualification.outputs.postgres_log == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node24)
        with:
          name: backend-postgres-log-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/postgres-server.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload backend-summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node24)
        with:
          name: backend-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-reports/backend.json
            ci-reports/backend-diagnostic.json
            ci-reports/backend.log
            ci-reports/db-lint.json
          if-no-files-found: warn
          retention-days: 1
          include-hidden-files: false

  database-pgtap:
    name: Database pgTAP (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: append-only
    if: ${{ !cancelled() && (needs.append-only.result != 'success' || needs.append-only.outputs.database != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      PGTAP_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      # Shard 1 exceeded the template clone budget. One worker runs the same shard without cloning.
      PGTAP_WORKERS: ${{ matrix.shard == 1 && '1' || vars.PGTAP_WORKERS || 'nproc' }}
    steps:
      - name: Record database job start
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - *timing_begin
      - name: Detect subject
        id: subject
        run: node scripts/ci-hosted/tasks.cjs detect database
      - *timing_node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node24)
        if: steps.subject.outputs.present == 'true'
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - *timing_work
      - name: Build database from zero and run pgTAP shard
        id: qualification
        if: steps.subject.outputs.present == 'true'
        run: node scripts/ci-hosted/backend.cjs
      - *timing_report
      - name: Upload Postgres server log
        if: ${{ !cancelled() && steps.qualification.outputs.postgres_log == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node24)
        with:
          name: pgtap-postgres-log-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-reports/postgres-server.log
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload pgTAP summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node24)
        with:
          name: pgtap-summary-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-reports/pgtap.json
            ci-reports/pgtap-diagnostic.json
            ci-reports/pgtap-files.json
            ci-reports/pgtap-timings.json
            ci-reports/pgtap.log
          if-no-files-found: warn
          retention-days: 1

  database:
    name: From-zero database build and pgTAP
    needs: [append-only, database-build, database-pgtap]
    if: ${{ always() && (needs.append-only.result != 'success' || needs.append-only.outputs.database != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci-hosted
            .github/actions/ci-timing
            config/ci/pgtap-accepted-failures.json
            supabase/tests/pgtap
          sparse-checkout-cone-mode: false
      - *timing_begin
      - *timing_node
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node24)
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Download build report
        if: ${{ always() && needs.database-build.outputs.present == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node24
        with:
          pattern: backend-summary-${{ github.run_id }}-*
          path: ci-reports/database-result/build
          merge-multiple: false
      - name: Download all pgTAP reports
        if: ${{ always() && needs.database-build.outputs.present == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2, Node24
        with:
          pattern: pgtap-summary-*-${{ github.run_id }}-*
          path: ci-reports/database-result/shards
          merge-multiple: false
      - *timing_work
      - name: Require build and every pgTAP shard
        if: always()
        env:
          BUILD_RESULT: ${{ needs.database-build.result }}
          DATABASE_PRESENT: ${{ needs.database-build.outputs.present }}
          PGTAP_RESULT: ${{ needs.database-pgtap.result }}
        run: node scripts/ci-hosted/database-result.cjs

  append-only:
    name: Append-only migrations
    outputs:
      database: ${{ steps.changes.outputs.database }}
      typecheck: ${{ steps.changes.outputs.typecheck }}
      unit: ${{ steps.changes.outputs.unit }}
      ui: ${{ steps.changes.outputs.ui }}
      build_console: ${{ steps.changes.outputs.build_console }}
      build_portal: ${{ steps.changes.outputs.build_portal }}
      build_landing: ${{ steps.changes.outputs.build_landing }}
      e2e: ${{ steps.changes.outputs.e2e }}
      preview_sweep: ${{ steps.changes.outputs.preview_sweep }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - *timing_begin
      - name: Select affected jobs with base code
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          # A missing base helper leaves the full graph enabled during rollout.
          if ! base="$(git rev-parse --verify 'HEAD^1^{commit}')" ||
             [[ "$(git ls-tree "$base" -- scripts/ci-hosted/changes.cjs)" != '100644 blob '* ]] ||
             ! git show "$base:scripts/ci-hosted/changes.cjs" > "$RUNNER_TEMP/changes.cjs" ||
             ! gates="$(node "$RUNNER_TEMP/changes.cjs" "$base")"; then
            printf '%s\n' 'Affected selection unavailable; running every job.'
            exit 0
          fi
          printf '%s\n' "$gates" >> "$GITHUB_OUTPUT"
      - *timing_work
      - name: Migrations are append-only
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT" in
            pull_request) base="$(git rev-parse HEAD^1)" ;;
            merge_group)
              [[ "$GROUP_BASE" =~ ^[a-f0-9]{40}$ ]] || exit 1
              git fetch --no-tags --depth=1 origin "$GROUP_BASE"
              base="$GROUP_BASE" ;;
            *) printf '%s\n' 'Skipped by design: append-only diff runs on pull_request and merge_group.'; exit 0 ;;
          esac
          result=0
          node scripts/ci-hosted/base-guard.cjs migrations.cjs "$base" || result=$?
          # Exercise checker updates before they land on the base branch.
          if ! git diff --quiet "$base" HEAD -- scripts/ci-hosted/migrations.cjs; then
            node scripts/ci-hosted/migrations.cjs "$base"
          fi
          exit "$result"
      - name: Check candidate install policy with base code
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: node scripts/ci-hosted/base-guard.cjs install-policy.cjs
      - name: Check proposed helper behavior
        run: |
          node scripts/ci-hosted/selfcheck.cjs
          node scripts/ci-hosted/shard-selfcheck.cjs
          node scripts/ci-hosted/database-selfcheck.cjs
          node --test scripts/ci-hosted/images.test.cjs
      - name: Check deploy branch references
        timeout-minutes: 1
        run: node scripts/ci-hosted/deploy-branch-refs.cjs
      - name: Test database deploy retry
        run: bash scripts/deploy/supabase-db-push-retry.test.sh

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LOCAL_GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - *timing_begin
      - name: Fetch lint base
        run: |
          [[ "$LOCAL_GATE_BASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'A proven lint base SHA is required.' >&2; exit 1; }
          git fetch --no-tags --depth=1 origin "$LOCAL_GATE_BASE_SHA"
          git cat-file -e "${LOCAL_GATE_BASE_SHA}^{commit}"
      - name: Detect subject
        id: subject
        run: node scripts/ci-hosted/tasks.cjs detect lint
      - *timing_node
      - &setup_npm
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node24)
        if: steps.subject.outputs.present == 'true'
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        with:
          node-version: '24.22.1'
          package-manager-cache: false
          cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'npm' || '' }}
          cache-dependency-path: package-lock.json
      - &timing_restore
        name: Mark npm-cache-restore timing boundary
        if: always() && steps.timing_prepare.outcome == 'success'
        uses: ./.github/actions/ci-timing
        with:
          phase: npm-cache-restore
      - &restore_npm
        id: restore_npm
        name: Restore npm cache
        if: steps.subject.outputs.present == 'true' && (github.event_name != 'push' || github.ref != 'refs/heads/main') && hashFiles('package-lock.json') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Match setup-node's path and key so the cache version is identical.
          path: ${{ runner.temp }}/npm-cache
          key: node-cache-${{ runner.os }}-x64-npm-${{ hashFiles('package-lock.json') }}
      - &timing_install
        name: Mark install timing boundary
        if: always() && steps.timing_prepare.outcome == 'success'
        uses: ./.github/actions/ci-timing
        with:
          phase: install
          npm-cache: ${{ steps.restore_npm.outcome == 'success' && (steps.restore_npm.outputs.cache-hit == 'true' && 'hit' || 'miss') || 'NOT_RUN' }}
      - &install_locked
        name: Locked dependency installation
        id: install
        if: steps.subject.outputs.present == 'true'
        env:
          NPM_CONFIG_CACHE: ${{ runner.temp }}/npm-cache
        run: node scripts/ci-hosted/tasks.cjs install
      - *timing_work
      - name: Verify Edge npm import lock
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'pull_request' ]] &&
             git diff --quiet --no-renames "$LOCAL_GATE_BASE_SHA" HEAD -- \
               supabase/functions supabase/config.toml package.json package-lock.json deno.lock scripts/edge .github/workflows/public-ci.yml; then
            printf '%s\n' 'Edge npm import lock inputs are unchanged.'
            exit 0
          fi
          node scripts/edge/verify-npm-import-lock.js
      - name: Check deploy edge preparation
        if: steps.subject.outputs.present == 'true'
        run: |
          if git diff --quiet --no-renames "$LOCAL_GATE_BASE_SHA" HEAD -- \
            .github/workflows/deploy.yml .github/workflows/public-ci.yml \
            package.json package-lock.json deno.lock config/edge/functions.json scripts/ci-hosted/tasks.cjs scripts/edge \
            supabase/config.toml supabase/functions tests/unit/ops/edge-frozen-lock.test.js; then
            exit 0
          fi
          npm run edge:sync-shared
          npm run edge:prepare-resource-import-exceljs
          mkdir -p "$RUNNER_TEMP/edge-tools"
          archive="$RUNNER_TEMP/deno.zip"
          curl --fail --silent --show-error --location https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-unknown-linux-gnu.zip --output "$archive"
          printf '394f07f4da2bebe6ce6f1e7ce0fa16429b29b08c35e3fac3fe25972676dff4b2  %s\n' "$archive" | sha256sum --check
          unzip -q "$archive" deno -d "$RUNNER_TEMP/edge-tools"
          export PATH="$RUNNER_TEMP/edge-tools:$PATH"
          export EDGE_FROZEN_WORKDIR="$RUNNER_TEMP/edge-frozen"
          node scripts/edge/verify-frozen-lock.cjs
          bash scripts/edge/verify-frozen-manifest.sh "$EDGE_FROZEN_WORKDIR"
          env -u EDGE_FROZEN_WORKDIR node --experimental-vm-modules node_modules/jest/bin/jest.js \
            --config config/tooling/jest.config.unit.js --runInBand --runTestsByPath tests/unit/ops/edge-frozen-lock.test.js
          EDGE_FROZEN_WORKDIR=.edge-frozen node scripts/edge/check-bundle-lock-drift.cjs
          printf 'void import("npm:qrcode-generator@1.5.2");\n' > "$RUNNER_TEMP/leak.ts"
          if node scripts/edge/check-frozen-bundle-imports.cjs "$RUNNER_TEMP/leak.ts" > "$RUNNER_TEMP/leak.log" 2>&1; then
            echo '::error::The offline Edge check accepted a dynamic npm import.'
            exit 1
          fi
          grep -F "Unbundled Edge import in $RUNNER_TEMP/leak.ts:1" "$RUNNER_TEMP/leak.log"
          touch "$EDGE_FROZEN_WORKDIR/supabase/unexpected.ts"
          if bash scripts/edge/verify-frozen-manifest.sh "$EDGE_FROZEN_WORKDIR"; then
            echo '::error::The frozen Edge manifest accepted an unexpected file.'
            exit 1
          fi
      - name: Run subject
        if: steps.subject.outputs.present == 'true'
        run: node scripts/ci-hosted/tasks.cjs lint

  typecheck:
    name: Typecheck
    needs: append-only
    if: ${{ !cancelled() && (needs.append-only.result != 'success' || needs.append-only.outputs.typecheck != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - *timing_begin
      - name: Detect typecheck subjects
        id: subject
        run: node scripts/ci-hosted/tasks.cjs detect typecheck
      - *timing_node
      - *setup_npm
      - *timing_restore
      - *restore_npm
      - *timing_install
      - *install_locked
      - *timing_work
      - name: Typecheck present apps sequentially
        if: steps.subject.outputs.present == 'true'
        run: |
          result=0
          for subject in apps/console apps/portal apps/fieldops; do
            if [[ -f "$subject/package.json" ]]; then
              node scripts/ci-hosted/tasks.cjs typecheck "$subject" || result=$?
            fi
          done
          # Console V2 is a Vite app with its own tsc script (#429).
          if [[ -f apps/console-v2/package.json ]]; then
            node scripts/ci-hosted/tasks.cjs typecheck apps/console-v2 || result=$?
          fi
          exit "$result"

  unit:
    name: Unit Jest (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: append-only
    if: ${{ !cancelled() && (needs.append-only.result != 'success' || needs.append-only.outputs.unit != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - *timing_begin
      - name: Detect subject
        id: subject
        run: node scripts/ci-hosted/tasks.cjs detect unit
      - *timing_node
      - *setup_npm
      - *timing_restore
      - *restore_npm
      - *timing_install
      - *install_locked
      - name: Install pinned Deno
        if: steps.subject.outputs.present == 'true'
        run: bash scripts/edge/install-pinned-deno.sh
      - *timing_work
      - name: Run subject
        if: steps.subject.outputs.present == 'true'
        run: node scripts/ci-hosted/base-guard.cjs jest.cjs unit
      - *timing_report
      - name: Report frozen Edge lock cases
        if: ${{ !cancelled() && hashFiles('ci-reports/jest-results.unit.*-of-*.json') != '' }}
        run: |
          jq -r '.suites[] | select(.file == "tests/unit/ops/edge-frozen-lock.test.js")
            | .tests[] | select(.fullName | startswith("checks the frozen Edge lock with a "))
            | "\(.status) \(.fullName)"' ci-reports/jest-results.unit.*-of-*.json
      - name: Check proposed test-result capture
        if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && steps.subject.outputs.present == 'true' }}
        env:
          JEST_DIAGNOSTIC_PROPOSAL: '1'
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- scripts/ci-hosted/jest.cjs scripts/ci-hosted/diagnostics.cjs; then
            node scripts/ci-hosted/jest.cjs unit
          fi
      - name: Upload unit-summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node24)
        with:
          name: unit-summary-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-reports/unit*.json
            ci-reports/jest-results.unit*.json
            ci-reports/known-failures-observed.unit*.txt
          if-no-files-found: warn
          retention-days: 1
          include-hidden-files: false
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      JEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}

  ui:
    name: Ui Jest
    needs: append-only
    if: ${{ !cancelled() && (needs.append-only.result != 'success' || needs.append-only.outputs.ui != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - *timing_begin
      - name: Detect Jest subject
        id: jest
        run: node scripts/ci-hosted/tasks.cjs detect ui
      - name: Select required workspace
        id: subject
        run: printf '%s\n' 'present=true' >> "$GITHUB_OUTPUT"
      - *timing_node
      - *setup_npm
      - *timing_restore
      - *restore_npm
      - *timing_install
      - *install_locked
      - *timing_work
      - name: Run subject
        if: steps.jest.outputs.present == 'true'
        run: node scripts/ci-hosted/base-guard.cjs jest.cjs ui
      - name: Run Console v2 Vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          CONSOLE_V2_CI_DEFER_CAPABILITY_LINT: '1'
        run: npm run test --workspace @masarx/console-v2
      - name: Capture signed-in previews
        id: preview-sweep
        timeout-minutes: 15
        if: ${{ !cancelled() && steps.install.outcome == 'success' && github.event_name == 'pull_request' && (needs.append-only.result != 'success' || needs.append-only.outputs.preview_sweep != 'false') }}
        env:
          FORCE_COLOR: '0'
        run: |
          if ! node scripts/ci-hosted/tasks.cjs browser-install >/dev/null 2>&1; then
            echo 'Preview sweep browser setup failed'
            exit 1
          fi
          for locale in en ar; do
            echo "Preview sweep locale: $locale"
            SWEEP_LOCALE="$locale" node node_modules/@playwright/test/cli.js test -c scripts/ci-hosted/preview-sweep.config.cjs 2>&1 |
              sed -u -nE \
                -e '/^SWEEP (console|console-v2|portal) (en|ar) (light|dark) (desktop|phone) (session|loading|empty|error|denied|complete)$/p' \
                -e '/^SWEEP-GEOM (console|console-v2|portal) (en|ar) (light|dark) (desktop|phone) (loading|empty|error|denied) [0-9]+ [0-9]+ (-?[0-9]+\.[0-9]{3} ){2}([0-9]+\.[0-9]{3} ){2}(0\.[0-9]{9}|1\.000000000)$/p' \
                -e '/^SWEEP-FAIL (console|console-v2|portal) (en|ar) (light|dark) (desktop|phone) (loading|empty|error|denied) (new-session|new-context|route-guard|session-cookie|init-session|new-page|open-shell|shell-theme|open-mobile-menu|follow-route-link|close-mobile-menu|open-route|signed-in|marker|marker-in-view|language|direction|theme|screenshot|close-context)$/p'
          done
      - name: Upload signed-in preview screenshots
        if: ${{ !cancelled() && steps.preview-sweep.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node24)
        with:
          name: signed-in-previews-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signed-in-previews/*.png
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false
      - *timing_report
      - name: Check proposed test-result capture
        if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && steps.jest.outputs.present == 'true' }}
        env:
          JEST_DIAGNOSTIC_PROPOSAL: '1'
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- scripts/ci-hosted/jest.cjs scripts/ci-hosted/diagnostics.cjs; then
            node scripts/ci-hosted/jest.cjs ui
          fi
      - name: Upload ui-summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node24)
        with:
          name: ui-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ci-reports/ui*.json
            ci-reports/jest-results.ui*.json
            ci-reports/known-failures-observed.ui*.txt
          if-no-files-found: warn
          retention-days: 1
          include-hidden-files: false

  build-console:
    name: Build (console)
    needs: append-only
    if: ${{ !cancelled() && (needs.append-only.result != 'success' || needs.append-only.outputs.build_console != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - *timing_begin
      - name: Detect console subject
        id: subject
        run: node scripts/ci-hosted/tasks.cjs detect apps/console
      - *timing_node
      - *setup_npm
      - *timing_restore
      - *restore_npm
      - *timing_install
      - *install_locked
      - *timing_work
      - name: Install lockfile-selected Chromium
        run: node scripts/ci-hosted/tasks.cjs browser-install
      - name: Build and measure Console V2
        run: node scripts/ci-hosted/tasks.cjs console-v2-speed
      - name: Build present console
        if: ${{ !cancelled() && steps.subject.outputs.present == 'true' && steps.install.outcome == 'success' }}
        run: node scripts/ci-hosted/tasks.cjs build apps/console

  build-portal-landing:
    name: Build (portal and landing)
    needs: append-only
    if: ${{ !cancelled() && (needs.append-only.result != 'success' || needs.append-only.outputs.build_portal != 'false' || needs.append-only.outputs.build_landing != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      BUILD_PORTAL: ${{ needs.append-only.result == 'success' && needs.append-only.outputs.build_portal || '' }}
      BUILD_LANDING: ${{ needs.append-only.result == 'success' && needs.append-only.outputs.build_landing || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - *timing_begin
      - name: Detect affected build subjects
        id: subject
        run: |
          if [[ "$BUILD_PORTAL" != false && -f apps/portal/package.json ]]; then
            printf '%s\n' 'portal=true' 'present=true' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$BUILD_LANDING" != false && -f scripts/frontend/build-landing.js ]]; then
            printf '%s\n' 'landing=true' 'present=true' >> "$GITHUB_OUTPUT"
          fi
      - *timing_node
      - *setup_npm
      - *timing_restore
      - *restore_npm
      - *timing_install
      - *install_locked
      - *timing_work
      - name: Install lockfile-selected Chromium
        if: steps.subject.outputs.portal == 'true'
        run: node scripts/ci-hosted/tasks.cjs browser-install
      - name: Build present portal
        if: steps.subject.outputs.portal == 'true'
        env:
          CI_PORTAL_SPEED: '1'
        run: node scripts/ci-hosted/tasks.cjs build apps/portal
      - name: Build present landing
        if: ${{ !cancelled() && steps.subject.outputs.landing == 'true' && steps.install.outcome == 'success' }}
        run: node scripts/ci-hosted/tasks.cjs build landing

  e2e:
    name: Landing E2E and Console V2 axe (full-app E2E excluded)
    needs: append-only
    if: ${{ !cancelled() && (needs.append-only.result != 'success' || needs.append-only.outputs.e2e != 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - *timing_begin
      - name: Detect landing browser subject
        id: subject
        run: node scripts/ci-hosted/tasks.cjs detect landing
      - name: Detect Console V2 browser subject
        id: console
        run: node scripts/ci-hosted/tasks.cjs detect apps/console-v2
      - *timing_node
      - *setup_npm
      - *timing_restore
      - *restore_npm
      - *timing_install
      - *install_locked
      - name: Install lockfile-selected Chromium
        if: steps.subject.outputs.present == 'true' || steps.console.outputs.present == 'true'
        run: node scripts/ci-hosted/tasks.cjs browser-install
      - *timing_work
      - name: Run synthetic local landing suite
        if: steps.subject.outputs.present == 'true'
        env:
          SPEED_EVIDENCE_DIR: test-results/speed-evidence
        run: |
          status=0
          node scripts/ci-hosted/tasks.cjs landing-e2e || status=$?
          shopt -s nullglob
          reports=("$SPEED_EVIDENCE_DIR"/speed--*.json)
          if (( ${#reports[@]} )); then
            jq -c '{screen, route, viewport, sampleCount: (.runs | length), p75, budget, limit}' "${reports[@]}"
          elif (( status == 0 )); then
            echo 'Missing Landing speed measurements.' >&2
            exit 1
          fi
          exit "$status"
      # Runs after a landing failure too, so one run reports both suites.
      - name: Run Console V2 seed-mode axe suite
        id: console_a11y
        if: ${{ !cancelled() && steps.console.outputs.present == 'true' }}
        env:
          A11Y_EVIDENCE_DIR: test-results/console-a11y/evidence
        run: node scripts/ci-hosted/tasks.cjs console-a11y
      - *timing_report
      - name: Upload Console V2 axe evidence
        if: ${{ !cancelled() && steps.console_a11y.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node24)
        with:
          name: console-a11y-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/console-a11y/evidence
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
      - name: Explain full-app browser exclusion
        run: |
          printf '%s\n' 'SKIPPED_BY_DESIGN: full Console/Portal/FieldOps E2E has no proven secret-free local fixture/auth contract.'
          printf '%s\n' 'Landing live edge intake remains excluded by its existing opt-in test flag; synthetic intake is the covered contract.'

  visual-baselines:
    name: Visual baselines (manual, prerequisites required)
    if: github.event_name == 'workflow_dispatch' && inputs.regenerate_visual_baselines
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - *timing_begin
      - name: Enable manual subject
        id: subject
        run: printf '%s\n' 'present=true' >> "$GITHUB_OUTPUT"
      - *timing_node
      - *setup_npm
      - *timing_restore
      - *restore_npm
      - *timing_install
      - name: Check visual prerequisites before installation
        run: node scripts/ci-hosted/tasks.cjs visual-preflight
      - *install_locked
      - name: Install lockfile-selected Chromium
        run: node scripts/ci-hosted/tasks.cjs browser-install
      - *timing_work
      - name: Regenerate visual baselines
        run: node scripts/ci-hosted/tasks.cjs visual
      - *timing_report
      - name: Upload visual-baselines
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node24)
        with:
          name: visual-baselines-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e/**/*-snapshots/*.png
          if-no-files-found: error
          retention-days: 1
          include-hidden-files: false

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.0 (Node24)
        with:
          fail-on-severity: high

  ci-gate:
    name: ci-gate
    needs: [database, database-build, database-pgtap, append-only, lint, typecheck, unit, ui, build-console, build-portal-landing, e2e, visual-baselines, dependency-review]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require the complete producer set
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          AFFECTED_REQUESTED: ${{ github.event_name == 'pull_request' }}
          VISUAL_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.regenerate_visual_baselines }}
          DEPENDENCY_REVIEW_REQUESTED: ${{ github.event_name == 'pull_request' }}
        run: |
          python3 -I - <<'PY'
          import json, os, sys, time
          started = time.monotonic()
          needs = json.loads(os.environ['NEEDS_JSON'])
          expected = {'database', 'database-build', 'database-pgtap', 'append-only', 'lint', 'typecheck', 'unit', 'ui', 'build-console', 'build-portal-landing', 'e2e', 'visual-baselines', 'dependency-review'}
          good = set(needs) == expected
          selector = needs.get('append-only', {})
          gates = selector.get('outputs', {}) if selector.get('result') == 'success' else {}
          affected_jobs = {
              'database': ('database',),
              'database-build': ('database',),
              'database-pgtap': ('database',),
              'typecheck': ('typecheck',),
              'unit': ('unit',),
              'ui': ('ui',),
              'build-console': ('build_console',),
              'build-portal-landing': ('build_portal', 'build_landing'),
              'e2e': ('e2e',),
          }
          for name in sorted(expected):
              result = needs.get(name, {}).get('result', 'missing')
              allowed = {'success'}
              if name == 'visual-baselines' and os.environ['VISUAL_REQUESTED'] != 'true':
                  allowed = {'skipped'}
              if name == 'dependency-review' and os.environ['DEPENDENCY_REVIEW_REQUESTED'] != 'true':
                  allowed = {'skipped'}
              if (os.environ['AFFECTED_REQUESTED'] == 'true' and name in affected_jobs
                      and all(gates.get(gate) == 'false' for gate in affected_jobs[name])):
                  allowed = {'success', 'skipped'}
              passed = result in allowed
              print(f'{name}: {result}; {"PASS" if passed else "FAIL"}')
              good = good and passed
          try:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as report:
                  summary = dict(job='ci-gate', setup_seconds={}, npm_cache='NOT_RUN',
                                 image_pull_seconds=None, replay_seconds=None, test_seconds=None,
                                 workload_seconds=round(time.monotonic() - started, 3))
                  payload = json.dumps(summary)
                  report.write('### CI timing\n\n```json\n' + payload + '\n```\n')
              print('CI timing: ' + payload)
          except (KeyError, OSError):
              print('CI timing summary unavailable')
          sys.exit(0 if good else 1)
          PY
