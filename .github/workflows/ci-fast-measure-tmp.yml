        run: |
          elapsed=$(( $(date +%s%3N) - START_MS ))
          bytes=$(du -sb "$MEASURE_CACHE/minimal.tar.zst" 2>/dev/null | cut -f1 || true)
          jq -n --arg action 'save' --arg set 'minimal' --arg outcome "$CACHE_OUTCOME" \
            --arg hit "$CACHE_HIT" --argjson elapsed "$elapsed" --argjson bytes "${bytes:-null}" \
            '{action:$action,set:$set,outcome:$outcome,cacheHit:$hit,seconds:($elapsed/1000),archiveBytes:$bytes}' \
            | tee ci-fast-evidence/cache-save-minimal.json >> "$GITHUB_STEP_SUMMARY"
      - name: Install locked dependencies
        run: node scripts/ci-hosted/tasks.cjs install
      - name: Measure minimal-db
        run: node scripts/ci-hosted/ci-fast-measure.cjs minimal-db
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-fast-minimal
          path: ci-fast-evidence/
          retention-days: 5
  restore:
    if: github.head_ref == 'ci/fast-measure' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [full, minimal]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      MEASURE_CACHE: ${{ runner.temp }}/ci-fast-measure
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
