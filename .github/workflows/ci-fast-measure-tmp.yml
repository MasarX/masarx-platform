      - name: Measure restore
        run: node scripts/ci-hosted/ci-fast-measure.cjs restore
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-fast-restore
          path: ci-fast-evidence/
          retention-days: 5
  hidden:
    if: github.head_ref == 'ci/fast-measure' && github.event.pull_request.head.repo.full_name == github.repository
    needs: full
