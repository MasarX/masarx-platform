name: Deploy dev

'on':
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        required: true
        options: [dev]
      mode:
        description: Operation to run
        type: choice
        required: true
        default: deploy
        options: [deploy, dry-run, api-schemas]
      expected_sha:
        description: Full main commit SHA (required in deploy mode)
        type: string
      project_ref:
        description: DEV Supabase project ref (required in dry-run mode before the deploy variable is set)
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  DEPLOY_ENV: ${{ inputs.environment || 'dev' }}
  CI: 'true'
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  api-schemas:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'api-schemas'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: dev
    steps:
      - name: Read configured API schemas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DIAGNOSTICS_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          schema_unreadable() {
            printf 'exposed_schema=UNREADABLE reason=%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          case "$DEPLOY_ENV:$GITHUB_REF" in
            dev:refs/heads/main) ;;
            *) schema_unreadable input ;;
          esac
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]]; then
            schema_unreadable input
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            schema_unreadable no-token
          fi
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          curl_status=0
          http_code="$(
            printf 'Authorization: Bearer %s\n' "$SUPABASE_ACCESS_TOKEN" |
              curl --fail --silent --max-time 20 --header @- \
                --output "$response_file" -w '%{http_code}' \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/postgrest"
          )" || curl_status=$?
          if (( curl_status != 0 )); then
            if (( curl_status == 22 )) && [[ "$http_code" =~ ^[1-9][0-9]{2}$ ]]; then
              schema_unreadable "http-$http_code"
            fi
            schema_unreadable "curl-$curl_status"
          fi
          if ! schemas="$(
            jq -ers 'select(length == 1) | .[0].db_schema | strings | split(",")
              | map(gsub("^[ \t]+|[ \t]+$"; ""))
              | select(all(.[]; test("\\A[a-z_][a-z0-9_]*\\z")))
              | .[] | "exposed_schema=\(.)"' "$response_file" 2>/dev/null
          )"; then
            schema_unreadable parse
          fi
          printf '%s\n' "$schemas" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read renderer JWT claims
        if: ${{ !cancelled() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          RENDERER_CONFIG_STATE_PATTERN: '^renderer_config_state=(missing_settings|missing_url|placeholder_url|missing_secret_ref|secret_unreadable|pin_mismatch|placeholder_secret|ready)$'
          RENDERER_TENANT_STATES_PATTERN: '^renderer_tenant_states=ready:[0-9]+,placeholder_url:[0-9]+,missing_url:[0-9]+,missing_secret_ref:[0-9]+,secret_unreadable:[0-9]+,pin_mismatch:[0-9]+,placeholder_secret:[0-9]+$'
          RENDERER_CONFIG_STATE_SQL: |
            BEGIN READ ONLY;
            SET LOCAL statement_timeout = '8s';
            SET LOCAL search_path = pg_catalog;
            \if :{?renderer_count_tenants}
            SET LOCAL renderer.count_tenants = 'on';
            \else
            SET LOCAL renderer.count_tenants = 'off';
            \endif
            -- Classify provider zero in each settings row without invoking the credential resolvers.
            DO $renderer_state$
            DECLARE
              settings jsonb;
              is_global boolean;
              provider jsonb;
              invoke_url text;
              secret_id uuid;
              metadata jsonb;
              state text;
              tenant_counts jsonb := '{}'::jsonb;
            BEGIN
              FOR settings, is_global IN
                SELECT public.resolve_settings('label_provider', 'global', NULL::uuid), true
                UNION ALL
                SELECT s.cached_value, false
                FROM public.settings s
                WHERE current_setting('renderer.count_tenants') = 'on'
                  AND s.category = 'label_provider' AND s.scope_type = 'tenant' AND s.scope_id IS NOT NULL
              LOOP
                provider := COALESCE(settings->'providers'->0, '{}'::jsonb);
                invoke_url := NULLIF(provider->>'invoke_url', '');
                IF settings IS NULL THEN
                  state := 'missing_settings';
                ELSIF invoke_url IS NULL THEN
                  state := 'missing_url';
                ELSIF invoke_url LIKE ('https://' || 'example' || '.%') THEN
                  state := 'placeholder_url';
                ELSIF provider#>>'{invoke_secret_ref,type}' IS DISTINCT FROM 'SecretRef'
                  OR pg_input_is_valid(provider#>>'{invoke_secret_ref,id}', 'uuid') IS NOT TRUE THEN
                  state := 'missing_secret_ref';
                ELSE
                  BEGIN
                    secret_id := (provider#>>'{invoke_secret_ref,id}')::uuid;
                    SELECT s.description::jsonb INTO metadata
                    FROM vault.secrets s
                    WHERE s.id = secret_id AND starts_with(s.name, 'label_provider/');
                    IF NOT FOUND THEN
                      state := 'secret_unreadable';
                    ELSIF (NOT (metadata ? 'pinned_invoke_url')
                      OR metadata->>'pinned_invoke_url' = invoke_url) IS NOT TRUE THEN
                      state := 'pin_mismatch';
                    ELSE
                      SELECT CASE
                        WHEN d.decrypted_secret IS NULL THEN 'secret_unreadable'
                        WHEN d.decrypted_secret = 'EXAMPLE_PASSWORD' THEN 'placeholder_secret'
                        ELSE 'ready'
                      END INTO state
                      FROM vault.decrypted_secrets d WHERE d.id = secret_id;
                      state := COALESCE(state, 'secret_unreadable');
                    END IF;
                  EXCEPTION WHEN OTHERS THEN
                    state := 'secret_unreadable';
                  END;
                END IF;
                IF is_global THEN
                  PERFORM set_config('renderer.config_state', state, true);
                ELSE
                  tenant_counts := jsonb_set(tenant_counts, ARRAY[state],
                    to_jsonb(COALESCE((tenant_counts->>state)::bigint, 0) + 1));
                END IF;
              END LOOP;
              PERFORM set_config('renderer.tenant_counts', tenant_counts::text, true);
            END;
            $renderer_state$;
            SELECT 'renderer_config_state=' || current_setting('renderer.config_state');
            \if :{?renderer_count_tenants}
            SELECT 'renderer_tenant_states=' || string_agg(
              label || ':' || COALESCE(current_setting('renderer.tenant_counts')::jsonb->>label, '0'),
              ',' ORDER BY position)
            FROM unnest(ARRAY['ready', 'placeholder_url', 'missing_url', 'missing_secret_ref',
              'secret_unreadable', 'pin_mismatch', 'placeholder_secret']) WITH ORDINALITY AS labels(label, position);
            \endif
            COMMIT;
        run: |
          set -euo pipefail
          renderer_unreadable() {
            printf '%s=UNREADABLE reason=%s\n' "${2:-renderer_jwt}" "$1" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          case "$DEPLOY_ENV:$GITHUB_REF" in
            dev:refs/heads/main) ;;
            *) renderer_unreadable input outbound_wake ;;
          esac
          if [[ -z "$PGPASSWORD" ]]; then
            renderer_unreadable no-password
          fi
          # Discover the primary pooler through the same lookup used by the deploy connection.
          if ! pooler="$(
            printf 'Authorization: Bearer %s\n' "$SUPABASE_ACCESS_TOKEN" |
              curl --fail --silent --max-time 20 --header @- \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler" |
              jq -ers 'select(length == 1) | .[0] | map(select(.database_type == "PRIMARY"))
                | select(length == 1) | .[0].db_host | strings
                | select(test("\\Aaws-[0-9]+-[a-z0-9-]+\\.pooler\\.supabase\\.com\\z"))' 2>/dev/null
          )"; then
            renderer_unreadable pooler
          fi
          ca_file="config/certs/supabase-prod-ca-2021.crt"
          if ! printf '700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  %s\n' "$ca_file" |
              sha256sum --check --status 2>/dev/null; then
            renderer_unreadable ca
          fi
          psql_stderr="$(mktemp)"
          trap 'rm -f "$psql_stderr"' EXIT
          renderer_psql() {
            PGHOST="$pooler" PGPORT=5432 PGDATABASE=postgres PGUSER="postgres.$SUPABASE_PROJECT_REF" \
              PGSSLMODE=verify-full PGSSLROOTCERT="$ca_file" PGGSSENCMODE=disable PGCONNECT_TIMEOUT=8 \
              timeout 20s psql -X -w -A -q -t -v ON_ERROR_STOP=1 -v VERBOSITY=sqlstate "$@" 2>"$psql_stderr"
          }
          renderer_query_failed() {
            local psql_status="$1" sqlstate
            shift
            sqlstate="$(LC_ALL=C sed -nE '/^(ERROR|FATAL):  [0-9A-Z]{5}$/ { s/^.*:  //; p; q; }' "$psql_stderr" 2>/dev/null)" || sqlstate=''
            if [[ -n "$sqlstate" ]]; then
              renderer_unreadable "sqlstate-$sqlstate" "$@"
            fi
            renderer_unreadable "psql-exit-$psql_status" "$@"
          }

          if backlog_metrics="$(renderer_psql <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '8s';
          SET LOCAL search_path = pg_catalog;
          WITH backlog AS (
            SELECT p.provider_type, oc.status,
              -- Classify only reserved test destinations using the queued URL or its Edge override.
              CASE WHEN COALESCE(
                CASE WHEN oc.renderer_credential_ref IS NULL THEN oc.context #>> '{edge_dispatch,url}' END,
                CASE WHEN oc.execution_url_vault_id IS NULL THEN oc.url END)
                ~* '^https?://(?:[a-z0-9-]+[.])*(?:[a-z0-9-]+[.](?:invalid|test|example)|example[.](?:com|net|org))[.]?(?::[0-9]+)?(?:[/?#]|$)'
                THEN 'sandbox' ELSE 'unknown' END AS target_class
            FROM public.outbound_calls oc
            LEFT JOIN public.providers p ON oc.target_type = 'provider' AND oc.target_id = p.id
              AND oc.renderer_credential_ref IS NULL
            -- Count all queued Edge work and mirror the leased claimant's due checks for failures.
            WHERE oc.status = 'pending_edge'
              OR (oc.status = 'failed'
                AND oc.scheduled_at <= now()
                AND (oc.lease_expires_at IS NULL OR oc.lease_expires_at < now())
                AND oc.retry_count < oc.max_retries)
          ), counts AS (
            SELECT provider_type, target_class,
              count(*) FILTER (WHERE status = 'failed') AS due_failed_count,
              count(*) FILTER (WHERE status = 'pending_edge') AS pending_edge_count
            FROM backlog
            GROUP BY provider_type, target_class
          )
          SELECT COALESCE(jsonb_agg(to_jsonb(counts)), '[]'::jsonb) FROM counts;
          COMMIT;
          SQL
          )"; then
            if backlog_readout="$(jq -ces '
              def valid_counts: all(.due_failed_count, .pending_edge_count;
                type == "number" and . >= 0 and . <= 9007199254740991 and floor == .);
              # Publish only fixed provider categories, since identifier syntax alone allows private values.
              def safe_provider: if type == "string" and test("\\A(?:3pl|ai|comms|delivery|geocoding|http|payment|routing|sms|webhook)\\z")
                then . else "other" end;
              select(length == 1) | .[0] | select(type == "array")
              | select(all(.[]; type == "object"
                  and keys == ["due_failed_count", "pending_edge_count", "provider_type", "target_class"]
                  and (.target_class == "sandbox" or .target_class == "unknown") and valid_counts))
              | map(.provider_type |= safe_provider)
              | group_by([.provider_type, .target_class])
              | map(.[0] + {due_failed_count: (map(.due_failed_count) | add),
                  pending_edge_count: (map(.pending_edge_count) | add)})
              | select(all(.[]; valid_counts))
            ' <<< "$backlog_metrics" 2>/dev/null)"; then
              printf 'outbound_backlog=%s\n' "$backlog_readout" | tee -a "$GITHUB_STEP_SUMMARY" || :
            else
              (renderer_unreadable validate outbound_backlog) || :
            fi
          else
            (renderer_query_failed "$?" outbound_backlog) || :
          fi

          wake_metrics="$(renderer_psql <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '8s';
          SET LOCAL search_path = pg_catalog;
          WITH sweep AS (
            SELECT jobid, active, schedule FROM cron.job
            WHERE jobname = 'outbound_wake_sweep'
            ORDER BY jobid DESC LIMIT 1
          ), sweep_runs AS (
            SELECT d.status FROM cron.job_run_details d JOIN sweep s USING (jobid)
            ORDER BY d.runid DESC LIMIT 10
          ), leased_finalizations AS NOT MATERIALIZED (
            -- Terminal queue rows have already cleared the lease token.
            SELECT pk->>'id' AS call_id, row_new->>'status' AS status, created_at
            FROM public.audit_table_changes
            WHERE schema_name = 'public' AND table_name = 'outbound_calls' AND op = 'UPDATE'
              AND row_old->>'status' = 'in_progress_edge' AND row_old->>'edge_lease_token' IS NOT NULL
              AND row_new->>'status' IN ('completed', 'failed', 'permanently_failed')
          ), queue AS (
            SELECT q.status, q.updated_at, q.scheduled_at, q.lease_expires_at, q.edge_lease_token,
              EXISTS (
                SELECT 1 FROM leased_finalizations f
                WHERE f.call_id = q.id::text AND f.status = q.status
                  AND f.created_at = q.updated_at
              ) AS edge_finalized
            FROM public.outbound_calls q
            WHERE q.status = 'pending_edge'
              OR (q.status IN ('in_progress_edge', 'completed', 'failed', 'permanently_failed')
                AND q.updated_at >= now() - interval '60 minutes')
          )
          SELECT to_jsonb(metrics) FROM (
            SELECT (
              -- The gate reserves a slot even when the queue is idle.
              SELECT floor(extract(epoch FROM now() - last_run_at))::bigint
              FROM public.cron_config WHERE worker_name = 'outbound_wake_relay'
            ) AS gate_slot_age_seconds,
            coalesce((SELECT active FROM sweep), false) AS cron_active,
            (SELECT schedule FROM sweep) AS cron_schedule,
            (SELECT count(*) FROM sweep_runs WHERE status = 'starting') AS cron_starting_count,
            (SELECT count(*) FROM sweep_runs WHERE status = 'connecting') AS cron_connecting_count,
            (SELECT count(*) FROM sweep_runs WHERE status = 'sending') AS cron_sending_count,
            (SELECT count(*) FROM sweep_runs WHERE status = 'running') AS cron_running_count,
            (SELECT count(*) FROM sweep_runs WHERE status = 'succeeded') AS cron_succeeded_count,
            (SELECT count(*) FROM sweep_runs WHERE status = 'failed') AS cron_failed_count,
            (SELECT count(*) FROM sweep_runs WHERE status IS NULL OR status NOT IN
              ('starting', 'connecting', 'sending', 'running', 'succeeded', 'failed')) AS cron_other_count,
            count(*) FILTER (WHERE status = 'pending_edge'
              AND updated_at >= now() - interval '60 minutes') AS edge_pending_60m_count,
            count(*) FILTER (WHERE status = 'in_progress_edge' AND edge_lease_token IS NOT NULL) AS edge_leased_60m_count,
            count(*) FILTER (WHERE status = 'completed' AND edge_finalized) AS edge_completed_60m_count,
            count(*) FILTER (WHERE status IN ('failed', 'permanently_failed') AND edge_finalized) AS edge_failed_60m_count,
            count(*) FILTER (WHERE status = 'pending_edge' AND scheduled_at < now() - interval '120 seconds'
              AND (lease_expires_at IS NULL OR lease_expires_at < now())) AS edge_pending_due_over_120s_count,
            (
              SELECT floor(extract(epoch FROM now() - created_at))::bigint
              FROM leased_finalizations WHERE status = 'completed'
              ORDER BY created_at DESC LIMIT 1
            ) AS edge_last_success_age_seconds
            FROM queue
          ) metrics;
          COMMIT;
          SQL
          )" || renderer_query_failed "$?" outbound_wake
          if ! wake_readout="$(jq -ces '
            def integer: type == "number" and floor == .;
            def cron_field: "(?:[0-9*/,-]|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|mon|tue|wed|thu|fri|sat|sun)+";
            def schedule: . == null or (type == "string" and length <= 128 and (
              test("\\A(?:" + cron_field + "[ \\t]+){4}" + cron_field + "\\z"; "i")
              or test("\\A(?:[1-9][0-9]? seconds|@(?:yearly|annually|monthly|weekly|daily|midnight|hourly))\\z"; "i")));
            select(length == 1) | .[0] | select(type == "object" and length == 16)
            | select(all(to_entries[];
                if .key == "cron_active" then .value | type == "boolean"
                elif .key == "cron_schedule" then .value | schedule
                elif .key | endswith("_age_seconds") then .value | . == null or integer
                elif .key | endswith("_count") then .value | integer and . >= 0
                else false end))
          ' <<< "$wake_metrics" 2>/dev/null)"; then
            renderer_unreadable validate outbound_wake
          fi
          printf 'outbound_wake=%s\n' "$wake_readout" | tee -a "$GITHUB_STEP_SUMMARY"

          wake_policy="$(renderer_psql <<'SQL'
          BEGIN TRANSACTION READ ONLY;
          SET LOCAL statement_timeout = '8s';
          SET LOCAL search_path = pg_catalog;
          SELECT jsonb_build_object(
            'policy_endpoint_present', NULLIF(btrim(state.endpoint), '') IS NOT NULL,
            'policy_endpoint_matches_relay', state.endpoint_matches,
            'relay_blocked_with_pending_work_count', (
              SELECT count(*) FROM public.ops_alerts
              WHERE organization_id = public.marketplace_system_org_id_v1()
                AND alert_type = 'outbound_wake_relay_blocked'
                AND created_at >= now() - interval '60 minutes'
            ),
            'blocked', state.blocked_with_pending_work
          ) FROM public.outbound_wake_relay_state_v1() state;
          COMMIT;
          SQL
          )" || renderer_query_failed "$?" outbound_wake_policy
          if ! wake_policy_readout="$(jq -ces '
            select(length == 1) | .[0] | select(type == "object")
            | select(keys == ["blocked", "policy_endpoint_matches_relay", "policy_endpoint_present",
                "relay_blocked_with_pending_work_count"])
            | select((.blocked | type == "boolean")
                and (.policy_endpoint_matches_relay | type == "boolean")
                and (.policy_endpoint_present | type == "boolean")
                and (.relay_blocked_with_pending_work_count | type == "number" and floor == . and . >= 0))
          ' <<< "$wake_policy" 2>/dev/null)"; then
            renderer_unreadable validate outbound_wake_policy
          fi
          printf 'outbound_wake_policy=%s\n' "$(jq -c 'del(.blocked)' <<< "$wake_policy_readout")" | tee -a "$GITHUB_STEP_SUMMARY"
          if jq -e '.blocked' <<< "$wake_policy_readout" >/dev/null; then
            printf 'outbound_wake_policy=BLOCKED pending Edge work cannot be woken by the relay\n' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          renderer_states="$(renderer_psql -v renderer_count_tenants=on <<< "$RENDERER_CONFIG_STATE_SQL")" || renderer_query_failed "$?"
          renderer_state="${renderer_states%%$'\n'*}"
          renderer_tenant_states="${renderer_states#*$'\n'}"
          [[ "$renderer_state" =~ $RENDERER_CONFIG_STATE_PATTERN ]] || renderer_unreadable state
          printf '%s\n' "$renderer_state" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$renderer_tenant_states" =~ $RENDERER_TENANT_STATES_PATTERN ]] || renderer_unreadable tenant-states
          printf '%s\n' "$renderer_tenant_states" | tee -a "$GITHUB_STEP_SUMMARY"
          [[ "$renderer_state" == renderer_config_state=ready ]] || exit 1

          claims="$(renderer_psql <<'SQL'
          BEGIN READ ONLY;
          SET LOCAL statement_timeout = '8s';
          SET LOCAL search_path = pg_catalog;
          WITH active AS MATERIALIZED (
            SELECT public.resolve_label_renderer_invoke_config_v1(NULL::uuid)->>'invoke_secret' AS jwt
          ), encoded AS (
            SELECT translate(split_part(jwt, '.', 2), '-_', '+/') AS payload
            FROM active
            WHERE jwt ~ '^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$'
          ), decoded AS MATERIALIZED (
            SELECT convert_from(decode(rpad(payload, (length(payload) + 3) / 4 * 4, '='), 'base64'), 'UTF8') AS payload
            FROM encoded
            WHERE length(payload) % 4 <> 1
          ), claims AS (
            SELECT CASE WHEN pg_input_is_valid(payload, 'jsonb') THEN payload::jsonb END AS value
            FROM decoded
          )
          SELECT jsonb_build_object(
            'role', CASE WHEN jsonb_typeof(value->'role') = 'string' THEN value->>'role' END,
            'iat', CASE WHEN jsonb_typeof(value->'iat') = 'number' THEN value->>'iat' END,
            'exp', CASE WHEN NOT (value ? 'exp') THEN 'none'
                        WHEN jsonb_typeof(value->'exp') = 'number' THEN value->>'exp' END,
            'count', (SELECT count(*)::text FROM vault.secrets WHERE starts_with(name, 'label_provider/'))
          ) FROM claims;
          COMMIT;
          SQL
          )" || renderer_query_failed "$?"
          if ! lines="$(jq -ers '
            def epoch: strings | test("\\A[0-9]+\\z");
            select(length == 1) | .[0]
            | select((.role | strings | test("\\A[a-z_][a-z0-9_]{0,62}\\z")
                and (contains(env.SUPABASE_PROJECT_REF) | not))
                and (.iat | epoch) and ((.exp == "none") or (.exp | epoch)) and (.count | epoch))
            | "renderer_jwt_role=\(.role)", "renderer_jwt_iat=\(.iat)",
              "renderer_jwt_exp=\(.exp)", "label_provider_vault_count=\(.count)"
          ' <<< "$claims" 2>/dev/null)"; then
            renderer_unreadable validate
          fi
          printf '%s\n' "$lines" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Read outbound wake HTTP diagnostics
        if: ${{ !cancelled() }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DIAGNOSTICS_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          edge_logs_unreadable() {
            printf 'edge_status_60m=UNREADABLE reason=%s\n' "$1" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          case "$DEPLOY_ENV:$GITHUB_REF" in
            dev:refs/heads/main) ;;
            *) edge_logs_unreadable input ;;
          esac

          # The sweep discards its request ID and pg_net deletes sent queue rows.
          printf 'outbound_wake_http=UNREADABLE reason=request-correlation-unavailable\n' | tee -a "$GITHUB_STEP_SUMMARY"
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]]; then
            edge_logs_unreadable input
          fi
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            edge_logs_unreadable no-token
          fi

          response_file="$(mktemp 2>/dev/null)" || edge_logs_unreadable temp
          trap 'rm -f "$response_file"' EXIT
          end_epoch="$(date -u +%s)"
          start="$(date -u -d "@$((end_epoch - 3600))" +%FT%TZ)"
          end="$(date -u -d "@$end_epoch" +%FT%TZ)"
          query="$(cat <<'SQL'
          SELECT replaceRegexpOne(log_attributes['request.pathname'], '^/functions/v1/', '') AS function_name,
                 toInt32OrZero(log_attributes['response.status_code']) AS status_code,
                 toString(count()) AS status_count
          FROM logs
          WHERE source = 'function_edge_logs'
            AND log_attributes['request.pathname'] IN ('/functions/v1/outbound-wake', '/functions/v1/api-caller')
            AND status_code BETWEEN 100 AND 599
          GROUP BY function_name, status_code
          SQL
          )"
          curl_status=0
          http_code="$(
            printf 'Authorization: Bearer %s\n' "$SUPABASE_ACCESS_TOKEN" |
              curl --fail --silent --max-time 20 --header @- --get \
                --output "$response_file" -w '%{http_code}' \
                --data-urlencode "iso_timestamp_start=$start" --data-urlencode "iso_timestamp_end=$end" \
                --data-urlencode "sql=$query" \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/analytics/endpoints/logs"
          )" || curl_status=$?
          if [[ "$http_code" =~ ^[1-5][0-9]{2}$ && "$http_code" != 200 ]]; then
            edge_logs_unreadable "http-$http_code"
          fi
          if (( curl_status != 0 )); then
            edge_logs_unreadable "curl-$curl_status"
          fi
          [[ "$http_code" == 200 ]] || edge_logs_unreadable validate

          if ! counts="$(jq -ces '
            def valid_row:
              type == "object" and keys == ["function_name", "status_code", "status_count"]
              and (.function_name == "outbound-wake" or .function_name == "api-caller")
              and (.status_code | type == "number" and (tostring | test("\\A[1-5][0-9]{2}\\z")))
              and (.status_count | type == "string" and test("\\A[1-9][0-9]{0,14}\\z"));
            select(length == 1) | .[0] | select(type == "object" and .error == null)
            | .result | select(type == "array" and all(.[]; valid_row))
            | select(all(group_by(.function_name, .status_code)[]; length == 1))
            | reduce .[] as $row ({"outbound-wake": {}, "api-caller": {}};
                .[$row.function_name][$row.status_code | tostring] = ($row.status_count | tonumber))
          ' "$response_file" 2>/dev/null)"; then
            edge_logs_unreadable validate
          fi
          printf 'edge_status_60m=%s\n' "$counts" | tee -a "$GITHUB_STEP_SUMMARY"

  database:
    if: github.event_name == 'push' || inputs.mode == 'deploy'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    # shortcut: Allow time for the first full apply, then set the steady-state limit from the measured first-deploy time.
    timeout-minutes: &dev-db-deploy-timeout-minutes 180
    environment: dev
    concurrency:
      group: deploy-dev-database
      cancel-in-progress: false
    outputs:
      superseded: ${{ steps.apply_guard.outputs.superseded }}
      configured: ${{ steps.guard.outputs.configured }}
      not_configured: ${{ steps.guard.outputs.configured == 'false' }}
    steps:
      - name: Guard configuration
        id: guard
        env:
          CONFIGURED: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' && secrets.SUPABASE_DB_PASSWORD != '' && secrets.SUPABASE_JWT_SECRET != '' && vars.SUPABASE_PROJECT_REF != '' }}
        run: |
          case "$DEPLOY_ENV:$GITHUB_REF" in
            dev:refs/heads/main) ;;
            *) echo '::error::Deployment requires the dev environment and the main branch ref'; exit 1 ;;
          esac
          printf 'configured=%s\n' "$CONFIGURED" >> "$GITHUB_OUTPUT"
          if [[ "$CONFIGURED" != true ]]; then
            echo '::notice::database skipped: not configured'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        if: steps.guard.outputs.configured == 'true'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node24)
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Guard database apply
        id: apply_guard
        if: steps.guard.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DEV_DB_REARMED_AT: ${{ vars.DEV_DB_REARMED_AT }}
        run: node scripts/deploy/apply-guard.cjs
      - name: Install locked edge dependencies
        if: &prepare-dev-edge steps.guard.outputs.configured == 'true' && steps.apply_guard.outputs.superseded == 'false'
        working-directory: ${{ github.workspace }}
        run: |
          for attempt in 1 2 3; do npm ci --ignore-scripts --no-audit --no-fund && break
            [[ "$attempt" == 3 ]] && exit 1; sleep "$((attempt * 2))"; done
      - name: Install pinned Deno
        if: *prepare-dev-edge
        run: &install-deno |
          mkdir -p "$RUNNER_TEMP/edge-tools"
          archive="$RUNNER_TEMP/deno.zip"
          curl --fail --silent --show-error --location https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-unknown-linux-gnu.zip --output "$archive"
          printf '394f07f4da2bebe6ce6f1e7ce0fa16429b29b08c35e3fac3fe25972676dff4b2  %s\n' "$archive" | sha256sum --check
          unzip -q "$archive" deno -d "$RUNNER_TEMP/edge-tools"
          printf '%s\n' "$RUNNER_TEMP/edge-tools" >> "$GITHUB_PATH"
      - name: Prepare edge packages and pinned CLI
        if: *prepare-dev-edge
        run: |
          npm run edge:sync-shared
          npm run edge:prepare-resource-import-exceljs
          mkdir -p "$RUNNER_TEMP/deploy-tools"
          archive="$RUNNER_TEMP/supabase.tar.gz"
          for attempt in 1 2 3; do curl --fail --silent --show-error --location https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz --output "$archive" && break
            [[ "$attempt" == 3 ]] && exit 1; sleep "$((attempt * 2))"; done
          printf '5b3031cb297d51b25be4c284e4c852254460ec722ec221d3b81b07d55acfd158  %s\n' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/deploy-tools" supabase
          node <<'NODE'
          const assert = require('node:assert/strict');
          const { statSync, writeFileSync } = require('node:fs');
          const { functions } = require('./config/edge/functions.json');
          const { functionsForDeploy } = require('./scripts/edge/functions-registry');
          const enabled = functionsForDeploy(functions, process.env.DEPLOY_ENV);
          assert.ok(enabled.length && new Set(enabled.map(f => f.name)).size === enabled.length);
          for (const { name, auth_mode } of enabled) {
            assert.ok(typeof name === 'string' && /^[a-z0-9-]+$/.test(name));
            assert.ok(['supabase_jwt', 'public_no_jwt'].includes(auth_mode));
            assert.ok(statSync(`supabase/functions/${name}/index.ts`).isFile());
          }
          writeFileSync('edge-deploy.tsv', enabled.map(f => `${f.name}\t${f.auth_mode}\n`).join(''));
          NODE
      - name: Verify Edge frozen lock
        id: edge_lock
        if: *prepare-dev-edge
        run: &verify-edge-lock node scripts/edge/verify-frozen-lock.cjs
      - name: Apply migrations and deploy registered edge functions
        id: deploy
        if: steps.guard.outputs.configured == 'true' && steps.apply_guard.outcome == 'success' && steps.apply_guard.outputs.superseded == 'false' && steps.edge_lock.outcome == 'success'
        env: &dev-database-env
          EDGE_DISPATCH_ENABLED: ${{ env.DEPLOY_ENV == 'dev' && 'true' || 'false' }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
          SUPABASE_PROJECT_REF: ${{ inputs.mode != 'dry-run' && vars.SUPABASE_PROJECT_REF || '' }}
          API_GATEWAY_CORS_ALLOW_ORIGINS: ${{ vars.API_GATEWAY_CORS_ALLOW_ORIGINS }}
          LABEL_RENDERER_CORS_ALLOW_ORIGINS: ${{ vars.LABEL_RENDERER_CORS_ALLOW_ORIGINS }}
          LANDING_CORS_ALLOW_ORIGINS: ${{ vars.LANDING_CORS_ALLOW_ORIGINS }}
          PUBLIC_TRACKING_CORS_ALLOW_ORIGINS: ${{ vars.PUBLIC_TRACKING_CORS_ALLOW_ORIGINS }}
        run: |
          set -euo pipefail
          printf '::add-mask::%s\n' "$SUPABASE_PROJECT_REF"
          umask 077
          deploy_temp="$(mktemp -d)"
          trap 'rm -f "$deploy_temp/edge.env" "$deploy_temp/db-push.log"; rmdir "$deploy_temp"' EXIT
          secret_file="$deploy_temp/edge.env"
          export EDGE_SECRET_FILE="$secret_file"
          node <<'NODE'
          const fs = require('node:fs');
          const { buildEdgeDbJwtBundle } = require('./scripts/ops/workspace/edge-db-jwt');
          const bundle = buildEdgeDbJwtBundle({ secret: process.env.SUPABASE_JWT_SECRET, includeMarketing: true });
          const token = bundle?.marketing_db_jwt;
          let role;
          try {
            role = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString('utf8')).role;
          } catch {
            // Report the contract failure without printing the credential.
          }
          if (role !== 'edge_marketing_role') {
            console.error('::error::Failed to mint MARKETING_DB_JWT with the edge_marketing_role claim.');
            process.exit(1);
          }
          for (const value of Object.values(bundle)) console.log('::add-mask::' + value);
          fs.writeFileSync(process.env.EDGE_SECRET_FILE, Object.entries(bundle)
            .map(([key, value]) => `${key.toUpperCase()}=${value}\n`).join('')
            + 'EDGE_REQUIRE_DB_JWT=1\nEDGE_ALLOW_SERVICE_ROLE_FALLBACK=0\n'
            + 'EDGE_INTERNAL_CALLER_ROLES=edge_api_gateway_role,edge_webhook_role,edge_api_caller_role\n', { mode: 0o600 });
          NODE
          if ! node <<'RENDERER_MINT' 2>/dev/null
          const { appendFileSync } = require('node:fs');
          const { createHmac } = require('node:crypto');
          const { createEdgeDbJwt } = require('./scripts/ops/workspace/edge-db-jwt');
          const secret = process.env.SUPABASE_JWT_SECRET;
          if (!secret) process.exit(1);
          const key = createHmac('sha256', secret).update('masarx-renderer-sign-v1').digest('hex');
          console.log('::add-mask::' + key);
          const gatewayJwt = createEdgeDbJwt({ secret, role: 'edge_renderer_gateway_role' });
          if (!gatewayJwt) process.exit(1);
          console.log('::add-mask::' + gatewayJwt);
          appendFileSync(process.env.EDGE_SECRET_FILE,
            `LABEL_RENDERER_SIGNING_KEY=${key}\nLABEL_RENDERER_GATEWAY_JWT=${gatewayJwt}\n`, { mode: 0o600 });
          RENDERER_MINT
          then
            echo '::error::Renderer credentials could not be written.'
            exit 1
          fi
          node scripts/deploy/append-function-cors.mjs
          if [[ "$DEPLOY_ENV" == dev ]]; then
            printf 'EDGE_ENVIRONMENT=%s\n' "$DEPLOY_ENV" >> "$secret_file"
          fi
          cli="$RUNNER_TEMP/deploy-tools/supabase"
          "$cli" link --project-ref "$SUPABASE_PROJECT_REF" --yes
          printf 'attempted=true\n' >> "$GITHUB_OUTPUT"
          SECONDS=0
          apply_status=1
          trap 'rm -f "$deploy_temp/edge.env"
          if [[ -f "$deploy_temp/db-push.log" ]]; then
            node scripts/deploy/apply-guard.cjs summarize "$deploy_temp/db-push.log" "$apply_status" "${apply_elapsed:-$SECONDS}" ||
              echo "::warning::Could not write database apply evidence"
          fi
          rm -f "$deploy_temp/db-push.log" "$deploy_temp/edge-secret-metadata.json"; rmdir "$deploy_temp"' EXIT
          export NO_COLOR=1
          "$cli" db push --linked --yes 2>&1 | tee "$deploy_temp/db-push.log" ||
            bash scripts/deploy/supabase-db-push.sh "$cli" "$deploy_temp/db-push.log" "${PIPESTATUS[@]}" 2>&1 | tee -a "$deploy_temp/db-push.log"
          apply_status=0
          apply_elapsed=$SECONDS
          bash scripts/deploy/sync-outbound-wake-endpoint.sh
          trap 'exec 1>&3 2>&4 3>&- 4>&-; echo "::error::Edge secret update failed" >&2' ERR
          exec 3>&1 4>&2 >/dev/null 2>&1
          "$cli" secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$secret_file"
          exec 1>&3 2>&4 3>&- 4>&-
          trap - ERR
          if ! "$cli" secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json 2>/dev/null |
            node -e '
              const { readFileSync } = require("node:fs");
              const { createHash } = require("node:crypto");
              const list = JSON.parse(readFileSync(0, "utf8"));
              const token = readFileSync(process.env.EDGE_SECRET_FILE, "utf8").match(/^MARKETING_DB_JWT=(.+)$/m)?.[1];
              if (!token) process.exit(1);
              const expected = createHash("sha256").update(token).digest("hex");
              if (list.find(entry => entry.name === "MARKETING_DB_JWT")?.value !== expected) process.exit(1);
            ' 2>/dev/null; then
            echo '::error::Marketing token verification failed.'
            exit 1
          fi
          if ! "$cli" secrets list --project-ref "$SUPABASE_PROJECT_REF" --output json 2>/dev/null | tee "$deploy_temp/edge-secret-metadata.json" |
            node -e '
              const { readFileSync } = require("node:fs");
              const { createHash } = require("node:crypto");
              const listed = JSON.parse(readFileSync(0, "utf8"));
              const local = readFileSync(process.env.EDGE_SECRET_FILE, "utf8");
              const names = ["LABEL_RENDERER_SIGNING_KEY", "LABEL_RENDERER_GATEWAY_JWT"];
              if (process.env.DEPLOY_ENV === "dev") names.push("EDGE_ENVIRONMENT", "EDGE_INTERNAL_CALLER_ROLES");
              for (const name of names) {
                const value = local.match(new RegExp(`^${name}=(.+)$`, "m"))?.[1];
                if (!value || listed.find(entry => entry.name === name)?.value !== createHash("sha256").update(value).digest("hex")) {
                  process.exit(1);
                }
              }
            ' 2>/dev/null; then
            echo '::error::Renderer credential digest verification failed.'
            exit 1
          fi
          node scripts/deploy/guarded-egress.cjs < "$deploy_temp/edge-secret-metadata.json" | tee -a "$GITHUB_STEP_SUMMARY"
          while IFS=$'\t' read -r function_name auth_mode; do
            flags=()
            if [[ "$auth_mode" == public_no_jwt ]]; then flags+=(--no-verify-jwt); fi
            "$cli" functions deploy "$function_name" --project-ref "$SUPABASE_PROJECT_REF" --use-api "${flags[@]}"
          done < edge-deploy.tsv
      - name: Record database push attempt
        if: ${{ always() && steps.deploy.outputs.attempted == 'true' }}
        run: echo 'Database push started'

  database-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run'
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 90
    env:
      DEV_DB_DEPLOY_TIMEOUT_MINUTES: *dev-db-deploy-timeout-minutes
    concurrency:
      group: dev-db-dry-run
      cancel-in-progress: false
    steps:
      - name: Guard dry-run configuration
        id: guard
        env:
          MODE: ${{ inputs.mode }}
          TARGET_MATCHES_DEV: ${{ vars.SUPABASE_PROJECT_REF == '' || vars.SUPABASE_PROJECT_REF == inputs.project_ref }}
        run: |
          if [[ "$MODE" != dry-run ]]; then
            echo '::error::This workflow requires mode=dry-run.'
            exit 1
          fi
          # Read the input inside the shell so the runner cannot log it before masking.
          if ! project_ref="$(jq -er '.inputs.project_ref | strings | select(test("\\A[a-z]{20}\\z"))' "$GITHUB_EVENT_PATH" 2>/dev/null)"; then
            echo '::error::Provide a valid DEV Supabase project ref as project_ref. SUPABASE_PROJECT_REF can be set after the dry run.'
            exit 1
          fi
          if [[ "$TARGET_MATCHES_DEV" != true ]]; then
            echo '::error::The dispatch project_ref must match the configured DEV project.'
            exit 1
          fi
          printf '::add-mask::%s\n' "$project_ref"
          printf '::add-mask::https://%s.supabase.co\n' "$project_ref"
          printf 'DEV_DRY_RUN_PROJECT_REF=%s\n' "$project_ref" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Node.js for Edge preparation
        run: |
          version="$(cat .nvmrc)"
          archive="$RUNNER_TEMP/node.tar.xz"
          mkdir -p "$RUNNER_TEMP/edge-node"
          curl --fail --silent --show-error --location "https://nodejs.org/dist/v$version/node-v$version-linux-x64.tar.xz" --output "$archive"
          printf '6c172a9ab6718f7b801fb5a7bd486af2ee5e32758086a04b84fcce2aa77095e6  %s\n' "$archive" | sha256sum --check
          tar -xJf "$archive" -C "$RUNNER_TEMP/edge-node" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/edge-node/bin" >> "$GITHUB_PATH"
      - name: Install pinned Deno
        run: *install-deno
      - name: Prepare edge packages
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run edge:sync-shared
          npm run edge:prepare-resource-import-exceljs
      - name: Verify Edge frozen lock
        run: *verify-edge-lock
      - name: Self-check Edge frozen lock drift
        run: node node_modules/jest/bin/jest.js --config config/tooling/jest.config.unit.js --runInBand --runTestsByPath tests/unit/ops/edge-frozen-lock.test.js --reporters=default
      - name: Install pinned Supabase CLI
        run: |
          mkdir -p "$RUNNER_TEMP/deploy-tools"
          archive="$RUNNER_TEMP/supabase.tar.gz"
          for attempt in 1 2 3; do curl --fail --silent --show-error --location https://github.com/supabase/cli/releases/download/v2.116.0/supabase_2.116.0_linux_amd64.tar.gz --output "$archive" && break
            [[ "$attempt" == 3 ]] && exit 1; sleep "$((attempt * 2))"; done
          printf '5b3031cb297d51b25be4c284e4c852254460ec722ec221d3b81b07d55acfd158  %s\n' "$archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP/deploy-tools" supabase
      - name: Link, measure and summarize dry run
        id: measure
        env: *dev-database-env
        run: |
          unset SUPABASE_JWT_SECRET
          export SUPABASE_PROJECT_REF="$DEV_DRY_RUN_PROJECT_REF" NO_COLOR=1
          # An empty password makes the linked CLI try to create a temporary login role.
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo '::error::Configure both SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in the dev environment.'
            exit 1
          fi
          umask 077
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          cli="$RUNNER_TEMP/deploy-tools/supabase"
          start=$SECONDS
          status=0
          stage='link'
          if "$cli" link --project-ref "$SUPABASE_PROJECT_REF" --yes > /dev/null 2>&1; then
            stage='dry-run'
            "$cli" db push --dry-run --linked > "$output" 2>&1 || status=$?
          else
            status=$?
          fi
          node - "$output" "$stage" "$status" "$((SECONDS - start))" <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const [file, stage, status, elapsed] = process.argv.slice(2);
          const lines = readFileSync(file, 'utf8').split(/\r?\n/);
          const planStart = lines.indexOf('Would push these migrations:');
          const migrations = [];
          if (planStart >= 0) {
            for (const line of lines.slice(planStart + 1)) {
              const row = /^\s*[•-] (.+)$/.exec(line);
              if (!row) break;
              migrations.push(row[1]);
            }
          }
          const hasPlan = status === '0' && (migrations.length > 0 || lines.includes('Remote database is up to date.'));
          const outOfOrder = lines.some(line => /Found local migration files to be inserted before the last migration|local migrations not found in remote|out[- ]of[- ]order/i.test(line));
          const missingLocal = lines.some(line => line.includes('Remote migration versions not found in local migrations directory.'));
          const masked = [process.env.SUPABASE_PROJECT_REF, process.env.SUPABASE_ACCESS_TOKEN, process.env.SUPABASE_DB_PASSWORD];
          function migrationName(name) {
            if (!name) return 'None';
            if (!/^\d+_[a-z0-9_.-]+\.sql$/i.test(name) || masked.some(value => value && name.includes(value))) return 'Redacted';
            return `\`${name}\``;
          }
          const count = hasPlan ? migrations.length : 'Unknown';
          const first = hasPlan ? migrationName(migrations[0]) : 'Unknown';
          const last = hasPlan ? migrationName(migrations.at(-1)) : 'Unknown';
          const timeoutMinutes = Number(process.env.DEV_DB_DEPLOY_TIMEOUT_MINUTES);
          const overLimit = Number(elapsed) > timeoutMinutes * 60;
          const order = [outOfOrder && 'out-of-order', missingLocal && 'missing-local'].filter(Boolean).join(',')
            || (hasPlan ? 'none' : 'unknown');
          const summary = [
            '## DEV database dry run', '',
            `- Migrations that would be applied: ${count}`,
            `- First migration: ${first}`,
            `- Last migration: ${last}`,
            `- Elapsed seconds (link and dry run): ${elapsed}`,
          ];
          console.log(`dry-run: migrations=${count} first=${first.replaceAll('`', '')} last=${last.replaceAll('`', '')} order=${order} elapsed=${elapsed}s over_${timeoutMinutes}_min=${overLimit}`);
          if (overLimit) summary.push(`- The operation exceeded the ${timeoutMinutes}-minute DEV database deploy job limit.`);
          if (outOfOrder) {
            summary.push('- Out of order: local migrations are missing from the remote migration history before its latest applied migration.');
            const migrationPath = 'supabase/migrations/';
            const names = lines.filter(line => line.startsWith(migrationPath))
              .map(line => migrationName(line.slice(migrationPath.length)));
            for (const name of names) summary.push(`  - ${name}`);
            if (names.length) console.log(`dry-run: out_of_order=${names.join(',').replaceAll('`', '')}`);
          }
          if (missingLocal) summary.push('- Remote migration versions are missing from the local migrations directory.');
          if (hasPlan && !outOfOrder && !missingLocal) summary.push('- Migration history findings: none reported by the CLI.');
          if (!hasPlan) {
            const failure = stage === 'link' ? 'Link failed. Check the DEV project ref and access token.'
              : status === '0' ? 'The CLI returned an unrecognized migration plan.'
                : 'The CLI could not produce a migration plan.';
            summary.push(`- ${failure}`);
            console.error(`::error::${failure} See the step summary.`);
            process.exitCode = Number(status) || 1;
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary.join('\n') + '\n');
          NODE

  console:
    needs: database
    if: ${{ !cancelled() && needs.database.result == 'success' && needs.database.outputs.superseded != 'true' && (needs.database.outputs.configured == 'true' || needs.database.outputs.not_configured == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: dev
    concurrency:
      group: deploy-dev-console
      cancel-in-progress: false
    outputs:
