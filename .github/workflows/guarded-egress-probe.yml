name: Guarded egress proxy probe

'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Proxy environment
        type: choice
        required: true
        options: [dev, stg]

permissions:
  contents: read

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

jobs:
  probe:
    if: github.ref == 'refs/heads/main' && (inputs.environment == 'dev' || inputs.environment == 'stg')
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node24)
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Verify the guarded proxy
        shell: bash
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          API_CALLER_GUARDED_EGRESS_PROOF_SHA: ${{ github.sha }}
          API_CALLER_GUARDED_EGRESS_PROXY_URL: ${{ secrets.API_CALLER_GUARDED_EGRESS_PROXY_URL }}
          API_CALLER_GUARDED_EGRESS_PROXY_USERNAME: ${{ secrets.API_CALLER_GUARDED_EGRESS_PROXY_USERNAME }}
          API_CALLER_GUARDED_EGRESS_PROXY_PASSWORD: ${{ secrets.API_CALLER_GUARDED_EGRESS_PROXY_PASSWORD }}
          API_CALLER_GUARDED_EGRESS_PROXY_HEALTH_URL: ${{ secrets.API_CALLER_GUARDED_EGRESS_PROXY_HEALTH_URL }}
          API_CALLER_GUARDED_EGRESS_PUBLIC_PROBE_URL: ${{ secrets.API_CALLER_GUARDED_EGRESS_PUBLIC_PROBE_URL }}
          API_CALLER_GUARDED_EGRESS_EXPECTED_PUBLIC_IP: ${{ secrets.API_CALLER_GUARDED_EGRESS_EXPECTED_PUBLIC_IP }}
          API_CALLER_GUARDED_EGRESS_POLICY_DENIED_PROBE_URL: ${{ secrets.API_CALLER_GUARDED_EGRESS_POLICY_DENIED_PROBE_URL }}
          API_CALLER_GUARDED_EGRESS_REBINDING_PROBE_URL: ${{ secrets.API_CALLER_GUARDED_EGRESS_REBINDING_PROBE_URL }}
          API_CALLER_GUARDED_EGRESS_POLICY_DENIED_CODE: ${{ secrets.API_CALLER_GUARDED_EGRESS_POLICY_DENIED_CODE }}
        run: |
          set -euo pipefail
          node scripts/deploy/guarded-egress.cjs probe | tee -a "$GITHUB_STEP_SUMMARY"
