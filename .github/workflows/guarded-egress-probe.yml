name: Guarded egress proxy probe

'on':
  workflow_dispatch:
    inputs:
      environment:
        description: Proxy environment
        type: choice
        required: true
        options: [dev, stg]

permissions:
  contents: read

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

jobs:
  probe:
    if: github.ref == 'refs/heads/main' && (inputs.environment == 'dev' || inputs.environment == 'stg')
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report probe status
        # shortcut: replace this status when the outbound path can prove proxy use and target refusal.
        run: echo 'egress_probe=not_configured' | tee -a "$GITHUB_STEP_SUMMARY"
