name: Provenance on tag

'on':
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      kind: ${{ steps.verify.outputs.kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: Verify the release tag and required CI check
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* || "$GITHUB_REF_NAME" == */* ]]; then
            echo '::error::Release requires a v* tag ref.'
            exit 1
          fi
          number='(0|[1-9][0-9]*)'
          if [[ "$GITHUB_REF" != "refs/tags/$GITHUB_REF_NAME" ||
                ! "$GITHUB_REF_NAME" =~ ^v${number}\.${number}\.${number}(-rc\.[1-9][0-9]*)?$ ]]; then
            echo '::error::Release requires a version tag or a numbered release-candidate tag.'
            exit 1
          fi
          if ! git rev-parse --verify "$GITHUB_REF^{tag}" > /dev/null 2>&1; then
            echo '::error::Release requires an annotated tag.'
            exit 1
          fi
          if ! tag_name="$(git cat-file tag "$GITHUB_REF" | sed -n '1,/^$/{s/^tag //p;}')" ||
             [[ "$tag_name" != "$GITHUB_REF_NAME" ]]; then
            echo '::error::Annotated tag name must match the tag ref.'
            exit 1
          fi
          kind=version
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then kind=rc; fi
          if ! sha="$(git rev-parse --verify "$GITHUB_REF^{commit}")" ||
             [[ "$sha" != "$(git rev-parse HEAD)" ]]; then
            echo '::error::Release tag does not resolve to the commit that triggered this run.'
            exit 1
          fi
          if ! git rev-list --first-parent refs/remotes/origin/main | grep -Fx "$sha" > /dev/null; then
            echo "::error::Release commit $sha is not on the first-parent history of origin/main."
            exit 1
          fi

          # Public CI on pull requests can skip jobs and can use changes to the workflow from the PR.
          if ! suites="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/workflows/public-ci.yml/runs?head_sha=$sha&per_page=100" \
            | jq -c '[.[].workflow_runs[]
              | select((.event == "merge_group" and (.head_branch // "" | startswith("gh-readonly-queue/main/")))
                or (.event == "push" and .head_branch == "main"))
              | .check_suite_id]')" ||
             ! checks="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/commits/$sha/check-runs?check_name=ci-gate&filter=all&per_page=100")"; then
            echo "::error::Could not read CI check evidence for release commit $sha."
            exit 1
          fi
          if ! jq -e --arg sha "$sha" --argjson suites "$suites" '
            [.[].check_runs[]
              | select(.name == "ci-gate" and .head_sha == $sha and .app.slug == "github-actions")
              | select(.check_suite.id as $suite | $suites | index($suite))]
            | max_by(.id)
            | .status == "completed" and .conclusion == "success"
          ' <<< "$checks" > /dev/null; then
            echo "::error::Release requires a successful ci-gate from the latest qualifying public CI evidence on $sha."
            exit 1
          fi
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf 'kind=%s\n' "$kind" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CI: 'true'
      ENV_FILE: /dev/null
      ENV_FILE_APPEND: '0'
      ENV_FILE_OVERRIDE: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node24)
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Install locked dependencies
        run: node scripts/ci-hosted/tasks.cjs install
      - name: Build and package the static landing site
        env:
          LANDING_CONTACT_ENDPOINT: /functions/v1/marketing-lead-intake
          LANDING_TENANT_SIGNUP_ENDPOINT: /functions/v1/tenant-signup-intake
        run: |
          node scripts/ci-hosted/tasks.cjs build landing
          test -s dist/landing/index.html
          mkdir release
          commit_time="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@$commit_time" --owner=0 --group=0 --numeric-owner -cf - -C dist/landing . \
            | gzip -n > release/landing.tar.gz
          (cd release && sha256sum landing.tar.gz > SHA256SUMS)
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      - name: Retain the staging candidate
        if: needs.verify.outputs.kind == 'rc'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (Node24)
        with:
          name: landing-${{ github.ref_name }}
          path: release/
          if-no-files-found: error
      - name: Publish GitHub release
        if: needs.verify.outputs.kind == 'version'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ needs.verify.outputs.sha }}
        run: |
          ref="$(jq -rn --arg ref "refs/tags/$RELEASE_TAG" '$ref | @uri')"
          if ! current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$ref" --jq .sha)" ||
             [[ "$current_sha" != "$RELEASE_SHA" ]]; then
            echo '::error::Release tag no longer resolves to the verified commit.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" release/landing.tar.gz release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" \
            --notes "Static landing build from $RELEASE_SHA. Intake routes require a compatible backend."
