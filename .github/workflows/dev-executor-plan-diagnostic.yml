name: DEV executor plan diagnostic

'on':
  workflow_dispatch:
    inputs:
      mode:
        description: DEV catalog diagnostic
        type: choice
        required: true
        default: executor-plan
        options: [executor-plan, find-extent-acl]

permissions:
  contents: read

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

jobs:
  executor-plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: dev
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve the DEV project for the ACL readback
        if: inputs.mode == 'find-extent-acl'
        id: acl-project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Mask the reference before the runner logs the next step's environment.
          project_ref="$(
            printf 'Authorization: Bearer %s\n' "$SUPABASE_ACCESS_TOKEN" |
              curl --fail --silent --max-time 15 --header @- https://api.supabase.com/v1/projects |
              jq -ers 'select(length == 1) | .[0] | select(length == 1) | .[0].ref | strings
                | select(test("\\A[a-z]{20}\\z"))' 2>/dev/null
          )" || { echo 'find_extent_acl=UNREADABLE reason=project-lookup'; exit 1; }
          printf '::add-mask::%s\n' "$project_ref"
          printf 'ref=%s\n' "$project_ref" >> "$GITHUB_OUTPUT"
      - name: Read the selected DEV catalog diagnostic
        shell: bash
        env:
          DIAGNOSTIC_MODE: ${{ inputs.mode }}
          SUPABASE_PROJECT_REF: ${{ inputs.mode == 'executor-plan' && vars.SUPABASE_PROJECT_REF || steps.acl-project.outputs.ref }}
          DEV_PROJECT_MATCH: ${{ inputs.mode == 'executor-plan' || (vars.SUPABASE_PROJECT_REF != '' && steps.acl-project.outputs.ref == vars.SUPABASE_PROJECT_REF) }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          case "$DIAGNOSTIC_MODE" in
            executor-plan|find-extent-acl) ;;
            *) exit 1 ;;
          esac
          unreadable() {
            printf '%s=UNREADABLE reason=%s\n' "${DIAGNOSTIC_MODE//-/_}" "$1" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          [[ "$DEV_PROJECT_MATCH" == true ]] || unreadable project-mismatch
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ && -n "$SUPABASE_ACCESS_TOKEN" && -n "$PGPASSWORD" ]] || unreadable configuration
          printf '::add-mask::%s\n' "$SUPABASE_PROJECT_REF"
          pooler="$(
            printf 'Authorization: Bearer %s\n' "$SUPABASE_ACCESS_TOKEN" |
              curl --fail --silent --max-time 20 --header @- \
                "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/database/pooler" |
              jq -ers 'select(length == 1) | .[0] | map(select(.database_type == "PRIMARY"))
                | select(length == 1) | .[0].db_host | strings
                | select(test("\\Aaws-[0-9]+-[a-z0-9-]+\\.pooler\\.supabase\\.com\\z"))' 2>/dev/null
          )" || unreadable pooler
          ca_file=config/certs/supabase-prod-ca-2021.crt
          printf '700723581420dd1ac98fd7e9ac529f0ef210eadcaf87fc868a3ad7d114c2f3b7  %s\n' "$ca_file" |
            sha256sum --check --status 2>/dev/null || unreadable ca
          read_catalog() {
            PGHOST="$pooler" PGPORT=5432 PGDATABASE=postgres PGUSER="postgres.$SUPABASE_PROJECT_REF" \
              PGSSLMODE=verify-full PGSSLROOTCERT="$ca_file" PGGSSENCMODE=disable PGCONNECT_TIMEOUT=8 \
              timeout 20s psql -X -w -A -q -t -v ON_ERROR_STOP=1 "$@" 2>/dev/null
          }
          if [[ "$DIAGNOSTIC_MODE" == find-extent-acl ]]; then
            acl="$(read_catalog -f scripts/deploy/dev-find-extent-acl.sql)" || unreadable catalog-query
            acl="$(jq -sce 'select(length == 1) | .[0] | select(
              (.anon_execute | type == "boolean") and (.authenticated_execute | type == "boolean") and
              (.execute_acl | type == "array") and
              all(.execute_acl[]; all(.grantor, .grantee; test("\\A[A-Za-z_][A-Za-z_0-9]*\\z"))))' <<< "$acl" 2>/dev/null)" || unreadable evidence-format
            printf '%s\n' "$acl" | tee -a "$GITHUB_STEP_SUMMARY"
            jq -e '.anon_execute == false and .authenticated_execute == false and
              all(.execute_acl[]; .grantor == "postgres")' <<< "$acl" >/dev/null
            exit
          fi
          closure=supabase/migrations/20261126163709_revoke_public_function_execute.sql
          grants="$(sed -n '/^GRANT EXECUTE ON FUNCTION$/,/^TO ui_rpc_executor;$/s/^  \(.*\)$/\1/p' "$closure" | sed 's/,$//')"
          revokes="$(sed -n '/^REVOKE EXECUTE ON FUNCTION$/,/^FROM PUBLIC;$/s/^  \(.*\)$/\1/p' "$closure" | sed 's/,$//')"
          readout="$(read_catalog -v grants="$grants" -v revokes="$revokes" \
            -f scripts/deploy/dev-executor-plan-diagnostic.sql)" || unreadable catalog-query
          state="${readout%%$'\n'*}"
          state_pattern='^closure_recorded=(true|false) closure_receipt=(true|false) predecessor_seal_valid=(true|false) public_targets=[0-9]+ direct_executor_targets=[0-9]+$'
          if [[ "${readout##*$'\n'}" != 'diagnostic_status=complete' || ! "$state" =~ $state_pattern ]]; then
            unreadable inputs-or-readout
          fi
          counts_pattern='^closure_added=[0-9]+ closure_removed=[0-9]+ closure_invalid=[0-9]+ before_extra=[0-9]+ projected_extra=[0-9]+$'
          row_pattern='^(relkind=[rpv] relispartition=(true|false) maintenance_name_match=(true|false) inherited_write_required=(true|false) executor_select=(true|false))( ([a-zA-Z_][a-zA-Z_0-9]*))?$'
          {
            printf '%s\n' "$state"
            while IFS= read -r row; do
              [[ "$row" != 'diagnostic_status=complete' ]] || continue
              if [[ "$row" =~ $counts_pattern ]]; then
                printf '%s\n' "$row"
              elif [[ "$row" =~ $row_pattern ]]; then
                evidence="${BASH_REMATCH[1]}"
                parent="${BASH_REMATCH[7]}"
                if [[ -n "$parent" ]] && git grep -qwF -e "$parent" -- supabase/migrations; then
                  printf '%s parent=%s\n' "$evidence" "$parent"
                else
                  printf '%s\n' "$evidence"
                fi
              else
                unreadable evidence-format
              fi
            done <<< "${readout#*$'\n'}"
            printf '%s\n' 'diagnostic_status=complete'
          } | tee -a "$GITHUB_STEP_SUMMARY"
