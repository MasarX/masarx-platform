# Generated by scripts/ci-hosted/render-policy.py; edit the canonical helpers and regenerate.
name: Required repository policy

'on':
  pull_request:
    types: [opened, synchronize, reopened, edited]
  merge_group:
    branches: [dev]
    types: [checks_requested]

permissions:
  contents: read

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

concurrency:
  group: required-policy-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  policy:
    name: Required repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (Node24)
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Resolve the trusted target base
        id: source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sha = value => {
            if (typeof value !== 'string' || value.length !== 40 || /[^a-f0-9]/.test(value)) throw new Error('Missing/invalid event SHA');
            return value;
          };
          function policySource(event, kind) {
            let branch; let base;
            if (kind === 'pull_request') {
              branch = event.pull_request?.base?.ref;
              base = event.pull_request?.base?.sha;
              if (branch !== 'dev' && branch !== 'main') throw new Error('Unsupported target branch');
            } else if (kind === 'merge_group') {
              branch = event.merge_group?.base_ref?.replace(/^refs\/heads\//, '');
              base = event.merge_group?.base_sha;
              // Main admission requires PR head identity, which a queue range does not carry.
              if (branch !== 'dev') throw new Error('Unsupported merge-group target branch');
            } else throw new Error('Unsupported policy event');
            return sha(base);
          }
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const base = policySource(event, process.env.GITHUB_EVENT_NAME);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `base=${base}\n`);
          NODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (Node24)
        with:
          ref: ${{ steps.source.outputs.base }}
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: scripts/ci-hosted
      - name: Enforce the target-base guard without executing candidate code
        run: node scripts/ci-hosted/policy.cjs
