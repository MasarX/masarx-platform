# Generated by scripts/ci-hosted/render-policy.py; edit the canonical helpers and regenerate.
name: Required repository policy

'on':
  pull_request_target:
    branches: [preview, dev, main]
  merge_group:
    branches: [preview, dev, main]
    types: [checks_requested]

permissions:
  contents: read

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

concurrency:
  group: required-policy-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  policy:
    name: Required repository policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # frozen version: 53b83947a5a98c8d113130e565377fae1a50d02f (Node24)
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Resolve the trusted target base
        id: source
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const sha = value => {
            if (!/^[a-f0-9]{40}$/.test(value || '')) throw new Error('Missing/invalid event SHA');
            return value;
          };
          function policySource(event, kind) {
            let branch; let base;
            if (kind === 'pull_request_target') {
              branch = event.pull_request?.base?.ref;
              base = event.pull_request?.base?.sha;
            } else if (kind === 'merge_group') {
              branch = event.merge_group?.base_ref?.replace(/^refs\/heads\//, '');
              base = event.merge_group?.base_sha;
            } else throw new Error('Unsupported policy event');
            if (!['preview', 'dev', 'main'].includes(branch)) throw new Error('Unsupported target branch');
            return sha(base);
          }
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const base = policySource(event, process.env.GITHUB_EVENT_NAME);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `base=${base}\n`);
          NODE
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # frozen version: de0fac2e4500dabe0009e67214ff5f5447ce83dd (Node24)
        with:
          ref: ${{ steps.source.outputs.base }}
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: scripts/ci-hosted
      - name: Enforce the target-base guard without executing candidate code
        run: node scripts/ci-hosted/policy.cjs
