name: Renderer upgrade rehearsal

'on':
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/renderer-upgrade-rehearsal.yml'
      - 'scripts/ci-hosted/renderer-upgrade-rehearsal.cjs'

permissions:
  contents: read

env:
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rehearsal:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Rehearse tagged renderer upgrade
        id: rehearse
        env:
          REHEARSAL_MAIN_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/ci-hosted/renderer-upgrade-rehearsal.cjs
      - name: Retain rehearsal evidence
        if: ${{ !cancelled() && steps.rehearse.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-upgrade-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/renderer-upgrade.json
          if-no-files-found: error
          retention-days: 7
